# Builds the desktop app for Windows and macOS on every push, checks that the
# packaged app starts and answers (desktop.py --smoke), and on a version tag
# (v0.1.0, …) publishes both as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Backspins-windows.zip
          - os: macos-14
            asset: Backspins-macos-arm64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Python files compile
        run: python -m compileall -q .
      - name: Stamp the version
        if: github.ref_type == 'tag'
        shell: bash
        # The app learns its own version here (version.py), which is how it
        # can tell when a newer release is out.
        run: echo "VERSION = '${GITHUB_REF_NAME#v}'" > version.py
      - name: Package
        env:
          BACKSPINS_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
        run: pyinstaller --noconfirm backspins.spec

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BACKSPINS_HOME: ${{ runner.temp }}\backspins-home
        run: |
          New-Item -ItemType Directory -Force $env:BACKSPINS_HOME | Out-Null
          # As a browser download leaves them: every file marked as coming from
          # the internet (Zone.Identifier, zone 3) — what broke the window.
          # (All but Backspins.exe itself, which the person has already said
          # "Run anyway" to — in CI nobody can answer that prompt.)
          Get-ChildItem dist\Backspins -Recurse -File | Where-Object { $_.Name -ne 'Backspins.exe' } | ForEach-Object {
            Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $q = Start-Process -FilePath dist\Backspins\Backspins.exe -ArgumentList '--probe-window' -Wait -PassThru
          Get-Content "$env:BACKSPINS_HOME\probe.log" -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\Backspins\Backspins.exe -ArgumentList '--smoke' -Wait -PassThru
          Get-Content "$env:BACKSPINS_HOME\smoke.log" -ErrorAction SilentlyContinue
          Get-Content "$env:BACKSPINS_HOME\server.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed: $($p.ExitCode)" }
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        env:
          BACKSPINS_HOME: ${{ runner.temp }}/backspins-home
        run: |
          mkdir -p "$BACKSPINS_HOME"
          dist/Backspins.app/Contents/MacOS/Backspins --smoke

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\Backspins -DestinationPath ${{ matrix.asset }}
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/Backspins.app ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: github.ref_type == 'tag'
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" Backspins-*.zip \
            --repo "${{ github.repository }}" --title "Backspins ${{ github.ref_name }}" --generate-notes
